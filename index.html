<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Separador de Chave de Acesso</title>
    <!-- Ícone da aba do navegador -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧾</text></svg>">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h2>Análise de Chave (44 dígitos)</h2>
        
        <!-- Área da Chave de Exemplo com Ícone -->
        <div class="area-teste">
            <p>Chave de teste:</p>
            <div class="chave-inline">
                <code id="chaveTeste">43230707385111000102555030007659731240866593</code>
                <button class="btn-icone" id="btnCopiar" onclick="copiarChave()" title="Copiar chave">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                        <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                    </svg>
                </button>
            </div>
        </div>
        
        <label for="chaveInput">Cole sua chave aqui:</label>
        <input type="text" id="chaveInput" maxlength="44" placeholder="Cole os 44 números aqui..." inputmode="numeric" oninput="this.value = this.value.replace(/[^0-9]/g, '')">
        
        <button class="btn-principal" onclick="analisarChave()">Separar Dados</button>

        <div id="resultado" class="escondido">
            <!-- Nova Área: Visualização colorida da chave -->
            <div id="chaveVisual" class="chave-visual">
                <span id="visUf" class="box box-uf" title="UF"></span>
                <span id="visData" class="box box-data" title="Ano/Mês"></span>
                <span id="visCnpj" class="box box-cnpj" title="CNPJ"></span>
                <span id="visModelo" class="box box-modelo" title="Modelo"></span>
                <span id="visSerie" class="box box-serie" title="Série"></span>
                <span id="visNumero" class="box box-numero" title="Número"></span>
                <span id="visEmissao" class="box box-emissao" title="Emissão"></span>
                <span id="visCodNum" class="box box-codnum" title="Código Numérico"></span>
                <span id="visDv" class="box box-dv" title="DV"></span>
            </div>

            <hr>

            <!-- Textos explicativos com as bordas coloridas ligadas à chave -->
            <p class="linha-dado box-uf"><strong>Estado (UF):</strong> <span id="resUf"></span></p>
            <p class="linha-dado box-data"><strong>Ano/Mês:</strong> <span id="resData"></span></p>
            <p class="linha-dado box-cnpj"><strong>CNPJ:</strong> <span id="resCnpj"></span></p>
            <p class="linha-dado box-cnpj"><strong>Razão Social:</strong> <span id="resRazaoSocial"></span></p>
            <p class="linha-dado box-modelo"><strong>Modelo:</strong> <span id="resModelo"></span></p>
            <p class="linha-dado box-serie"><strong>Série:</strong> <span id="resSerie"></span></p>
            <p class="linha-dado box-numero"><strong>Número da Nota:</strong> <span id="resNumero"></span></p>
            <p class="linha-dado box-emissao"><strong>Forma de Emissão:</strong> <span id="resEmissao"></span></p>
            <p class="linha-dado box-codnum"><strong>Código Numérico:</strong> <span id="resCodNum"></span></p>
            <p class="linha-dado box-dv"><strong>Dígito Verificador:</strong> <span id="resDv"></span></p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
